<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق النخبة PRO - تحت إشراف صفوان</title>
    
    <!-- Fonts with better fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ========== RESET & BASE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html {
            font-size: 16px;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Tajawal', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: #f8fafc;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            touch-action: manipulation;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        /* ========== LOADING SCREEN ========== */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #020617;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading-content {
            text-align: center;
            padding: 20px;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            border-top-color: #3b82f6;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========== HEADER ========== */
        header {
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            text-align: center;
            position: relative;
            z-index: 100;
            flex-shrink: 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .supervisor {
            font-size: 11px;
            color: #94a3b8;
            white-space: nowrap;
        }

        .app-title {
            font-size: 13px;
            font-weight: 900;
            color: #3b82f6;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .icon-btn:active {
            transform: scale(0.95);
            background: rgba(59, 130, 246, 0.2);
        }

        /* ========== STATS GRID ========== */
        .stats-container {
            padding: 16px;
            flex-shrink: 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 14px 10px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .stat-label {
            font-size: 10px;
            color: #94a3b8;
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 900;
            line-height: 1.2;
        }

        .stat-value.blue { color: #60a5fa; }
        .stat-value.green { color: #34d399; }
        .stat-value.yellow { color: #fbbf24; }
        .stat-value.red { color: #f87171; }

        /* ========== CARD CONTAINER ========== */
        .card-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            position: relative;
            min-height: 0;
            overflow: hidden;
        }

        .card-wrapper {
            width: 100%;
            max-width: 500px;
            height: 320px;
            perspective: 1000px;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 24px;
            cursor: pointer;
        }

        .card-inner.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-front {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card-back {
            background: linear-gradient(145deg, rgba(30, 58, 138, 0.8), rgba(23, 23, 23, 0.9));
            transform: rotateY(180deg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card-number {
            position: absolute;
            top: 16px;
            left: 16px;
            font-size: 12px;
            font-weight: 700;
            color: #60a5fa;
            opacity: 0.7;
        }

        .term-title {
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 16px;
            color: #f8fafc;
            line-height: 1.3;
            padding: 0 20px;
        }

        .term-description {
            font-size: 16px;
            line-height: 1.6;
            text-align: center;
            color: #cbd5e1;
            padding: 0 20px;
            max-height: 180px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .hint-text {
            position: absolute;
            bottom: 20px;
            color: #94a3b8;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ========== NAVIGATION CONTROLS ========== */
        .nav-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px 16px;
            flex-shrink: 0;
        }

        .nav-btn {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            font-size: 18px;
            transition: all 0.2s ease;
            touch-action: manipulation;
        }

        .nav-btn:active {
            background: rgba(59, 130, 246, 0.2);
            transform: scale(0.95);
        }
/* ========== RATING BUTTONS ========== */
.rating-container {
    padding: 0 16px 20px;
    flex-shrink: 0;
}

.rating-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 500px;
    margin: 0 auto;
}

.rating-btn {
    height: 80px;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid transparent;
    transition: all 0.2s ease;
    touch-action: manipulation;
    padding: 12px;
}

.rating-btn:active {
    transform: scale(0.98);
}

.rating-btn.hard {
    background: rgba(239, 68, 68, 0.1);
    border-color: rgba(239, 68, 68, 0.2);
    color: #f87171;
}

.rating-btn.mid {
    background: rgba(245, 158, 11, 0.1);
    border-color: rgba(245, 158, 11, 0.2);
    color: #fbbf24;
}

.rating-btn.easy {
    background: rgba(34, 197, 94, 0.1);
    border-color: rgba(34, 197, 94, 0.2);
    color: #34d399;
}

.rating-icon {
    font-size: 20px;
}

.rating-text {
    font-size: 14px;
    font-weight: 700;
}

.rating-points {
    font-size: 11px;
    opacity: 0.7;
}

/* ========== FOCUS CONTROLS ========== */
.focus-controls {
    display: flex;
    gap: 10px;
    padding: 12px 16px;
    background: rgba(0, 0, 0, 0.3);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    flex-shrink: 0;
}

.frequency-buttons {
    display: flex;
    gap: 8px;
    flex: 1;
}

.freq-btn {
    flex: 1;
    height: 44px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #94a3b8;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s ease;
}

.freq-btn.active {
    background: rgba(59, 130, 246, 0.2);
    border-color: #3b82f6;
    color: #60a5fa;
}

.pomodoro-container {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 0 12px;
    min-width: 140px;
}

.pomodoro-timer {
    font-family: monospace;
    font-size: 16px;
    font-weight: 700;
    color: #60a5fa;
}

.pomodoro-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: #3b82f6;
    border: none;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    transition: all 0.2s ease;
}

.pomodoro-btn:active {
    transform: scale(0.95);
}

/* ========== TOAST NOTIFICATIONS ========== */
.toast-container {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    width: 90%;
    max-width: 400px;
    pointer-events: none;
}

.toast {
    background: rgba(0, 0, 0, 0.9);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.3s ease;
    pointer-events: auto;
}

.toast.show {
    opacity: 1;
    transform: translateY(0);
}

.toast-icon {
    font-size: 18px;
}

.toast.success .toast-icon { color: #34d399; }
.toast.error .toast-icon { color: #f87171; }
.toast.warning .toast-icon { color: #fbbf24; }
.toast.info .toast-icon { color: #60a5fa; }

.toast-message {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
}

/* ========== MODALS ========== */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 2000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

.modal-overlay.show {
    opacity: 1;
    pointer-events: all;
}

.modal {
    background: linear-gradient(145deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    width: 100%;
    max-width: 500px;
    max-height: 80vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    transform: scale(0.9);
    transition: transform 0.3s ease;
}

.modal-overlay.show .modal {
    transform: scale(1);
}

.modal-header {
    padding: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-title {
    font-size: 18px;
    font-weight: 700;
    color: #f8fafc;
}

.modal-close {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    font-size: 16px;
}

.modal-body {
    padding: 20px;
}

/* ========== RESPONSIVE DESIGN ========== */
@media (max-width: 480px) {
    html { font-size: 15px; }
    
    .card-wrapper {
        height: 300px;
    }
    
    .term-title {
        font-size: 22px;
    }
    
    .term-description {
        font-size: 15px;
    }
    
    .rating-btn {
        height: 70px;
    }
    
    .stats-grid {
        gap: 8px;
    }
    
    .stat-card {
        padding: 12px 8px;
    }
    
    .stat-value {
        font-size: 16px;
    }
}
        @media (max-width: 360px) {
            html { font-size: 14px; }
            
            .card-wrapper {
                height: 280px;
            }
            
            .term-title {
                font-size: 20px;
            }
            
            .rating-grid {
                gap: 8px;
            }
            
            .rating-btn {
                height: 65px;
            }
            
            .nav-btn {
                width: 45px;
                height: 45px;
            }
            
            .pomodoro-container {
                min-width: 120px;
            }
        }

        @media (min-width: 768px) {
            .card-wrapper {
                height: 350px;
            }
            
            .term-title {
                font-size: 28px;
            }
        }

        /* ========== UTILITY CLASSES ========== */
        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .slide-up {
            animation: slideUp 0.3s ease forwards;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* ========== CUSTOM SCROLLBAR ========== */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        /* ========== REDUCED MOTION ========== */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ========== PROGRESS BAR ========== */
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        /* ========== ACHIEVEMENTS ========== */
        .achievements-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            flex-wrap: wrap;
        }

        .achievement-badge {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .achievement-badge.unlocked {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(139, 92, 246, 0.3));
            border-color: rgba(59, 130, 246, 0.5);
        }

        .achievement-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .achievement-name {
            font-size: 9px;
            font-weight: 700;
            text-align: center;
        }

        /* ========== VIBRATION SAFETY ========== */
        .vibration-safe {
            /* Ensure elements don't cause layout shifts on vibration */
            contain: layout style paint;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <h2 style="color: #3b82f6; margin-bottom: 10px;">تطبيق النخبة PRO</h2>
            <p style="color: #94a3b8; font-size: 14px;">تحت إشراف: صفوان</p>
            <div class="progress-container" style="margin-top: 20px; width: 200px;">
                <div id="loading-progress" class="progress-bar" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="header-content">
            <div class="supervisor">تحت إشراف: صفوان</div>
            <div class="app-title">النخبة PRO</div>
            <div class="header-actions">
                <button class="icon-btn" id="stats-btn" title="الإحصائيات">
                    <i class="fas fa-chart-bar"></i>
                </button>
                <button class="icon-btn" id="export-btn" title="تصدير البيانات">
                    <i class="fas fa-download"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Stats Grid -->
    <div class="stats-container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">الاستيعاب</div>
                <div id="p-val" class="stat-value blue">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">المستوى</div>
                <div id="level-val" class="stat-value green">مبتدئ</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">النقاط</div>
                <div id="s-val" class="stat-value yellow">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">المتبقي</div>
                <div id="r-val" class="stat-value red">15</div>
            </div>
        </div>
    </div>

    <!-- Card Section -->
    <div class="card-section">
        <div class="card-wrapper" id="cardWrapper">
            <div class="card-inner" id="main-card" onclick="flipCard()">
                <div class="card-face card-front">
                    <div class="card-number">CARD #<span id="c-id">1</span></div>
                    <h2 id="c-title" class="term-title">تحميل البطاقة...</h2>
                    <div class="hint-text">
                        <i class="fas fa-hand-point-up"></i>
                        انقر لعرض التعريف
                    </div>
                </div>
                <div class="card-face card-back">
                    <p id="c-desc" class="term-description"></p>
                    <div class="hint-text">
                        <i class="fas fa-star"></i>
                        قيّم صعوبة المصطلح
                    </div>
                </div>
            </div>
        </div>
    </div>
<!-- Navigation Controls -->
<div class="nav-controls">
    <button class="nav-btn" onclick="prevCard()">
        <i class="fas fa-chevron-right"></i>
    </button>
    <div style="width: 20px;"></div>
    <button class="nav-btn" onclick="nextCard()">
        <i class="fas fa-chevron-left"></i>
    </button>
</div>

<!-- Rating Buttons -->
<div class="rating-container">
    <div class="rating-grid">
        <button class="rating-btn hard" onclick="rateCard('hard')">
            <i class="fas fa-fire rating-icon"></i>
            <span class="rating-text">صعب</span>
            <span class="rating-points">+5 نقاط</span>
        </button>
        <button class="rating-btn mid" onclick="rateCard('mid')">
            <i class="fas fa-balance-scale rating-icon"></i>
            <span class="rating-text">متوسط</span>
            <span class="rating-points">+15 نقطة</span>
        </button>
        <button class="rating-btn easy" onclick="rateCard('easy')">
            <i class="fas fa-check-circle rating-icon"></i>
            <span class="rating-text">سهل</span>
            <span class="rating-points">+40 نقطة</span>
        </button>
    </div>
</div>

<!-- Focus Controls -->
<div class="focus-controls">
    <div class="frequency-buttons">
        <button class="freq-btn" onclick="toggleFrequency(45, this)">
            <i class="fas fa-brain"></i>
            <span>45Hz</span>
        </button>
        <button class="freq-btn" onclick="toggleFrequency(8, this)">
            <i class="fas fa-moon"></i>
            <span>8Hz</span>
        </button>
        <button class="freq-btn" onclick="toggleFrequency(432, this)">
            <i class="fas fa-music"></i>
            <span>432Hz</span>
        </button>
    </div>
    <div class="pomodoro-container">
        <div id="pomo-clock" class="pomodoro-timer">25:00</div>
        <button id="pomo-btn" class="pomodoro-btn" onclick="togglePomodoro()">
            <i class="fas fa-play"></i>
        </button>
    </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<!-- Stats Modal -->
<div class="modal-overlay" id="stats-modal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">الإحصائيات المتقدمة</div>
            <button class="modal-close" onclick="closeModal('stats-modal')">
                <i class="fas fa-times"></i>
            </button>
        </div>

<script>
    // ========== GLOBAL STATE ==========
    const APP_STATE = {
        // Card Data
        cards: [
            { term: "الثنائية القطبية", definition: "نظام دولي ساد بعد الحرب العالمية الثانية، يعتمد على وجود قطبين متصارعين هما المعسكر الشرقي والغربي." },
            { term: "الحرب الباردة", definition: "صراع إيديولوجي ومصلحي بين المعسكرين استُخدمت فيه جميع الوسائل عدا المواجهة العسكرية المباشرة." },
            { term: "سياسة الاحتواء", definition: "خطة أمريكية تعتمد على محاصرة الاتحاد السوفياتي بسلسلة من الأحلاف والقواعد العسكرية ومنع انتشار الشيوعية." },

            { term: "الكوميكون", definition: "منظمة اقتصادية للمعسكر الشرقي تأسست في 1949 بهدف التعاون الاقتصادي بين دول الكتلة." },
            { term: "التعايش السلمي", definition: "سياسة دعا إليها خروشوف عام 1956 تقوم على قبول فكرة تعدد الأنظمة وتجنب الصدام النووي." },
            { term: "مؤتمر الصومام", definition: "لقاء تنظيمي في 20 أوت 1956 هيكل الثورة عسكرياً وسياسياً وأقر مبدأ أولوية الداخل." },
            { term: "سياسة الإغراء", definition: "مشاريع اقتصادية فرنسية تهدف لعزل الشعب عن الثورة عبر تحسين الظروف المعيشية." },
            { term: "القوة الثالثة", definition: "فئة من الجزائريين الموالين لفرنسا حاولت فرنسا استخدامهم كبديل لجبهة التحرير." },
            { term: "مشروع قسنطينة", definition: "مشروع إغرائي استعماري أعلنه ديغول عام 1958 لإفراغ الثورة من محتواها الاجتماعي." },
            { term: "سلم الشجعان", definition: "مناورة سياسية أطلقها ديغول عام 1958 يطالب فيها الثوار بتسليم أسلحتهم مقابل العفو." },
            { term: "حق تقرير المصير", definition: "مبدأ ينص على حق الشعوب الخاضعة للاستعمار في اختيار نظامها السياسي ومصيرها." },
            { term: "منظمة الوحدة الإفريقية", definition: "منظمة تأسست عام 1963 لتعزيز التعاون بين دول القارة ومحاربة الاستعمار." },
            { term: "حركة عدم الانحياز", definition: "تجمع دولي تأسس عام 1961 تبنى الحياد الإيجابي تجاه صراع الحرب الباردة." }
        ],
        
        // User Progress
        currentCardIndex: 0,
        score: 0,
        reviewedCards: 0,
        totalStudyTime: 0, // in minutes
        
        // Difficulty Stats
        difficultyStats: {
            hard: 0,
            mid: 0,
            easy: 0
        },
        
        // Achievements
        achievements: [
            { id: 'first_card', name: 'البداية', icon: 'fa-star', unlocked: false },
            { id: 'fast_learner', name: 'متسارع', icon: 'fa-bolt', unlocked: false },
            { id: 'focus_master', name: 'مركز', icon: 'fa-brain', unlocked: false },
            { id: 'elite', name: 'نخبة', icon: 'fa-trophy', unlocked: false },
            { id: 'consistency', name: 'منتظم', icon: 'fa-calendar-check', unlocked: false }
        ],
        
        // Settings
        activeFrequency: null,
        pomodoroTime: 1500, // 25 minutes in seconds
        pomodoroRunning: false,
        pomodoroInterval: null,
        
        // Session Data
        sessionStartTime: Date.now(),
        lastCardTime: Date.now(),
        
        // Audio Context
        audioContext: null,
        oscillator: null
    };
// ========== INITIALIZATION ==========
async function initApp() {
    console.log('🔧 تهيئة التطبيق...');
    
    // محاكاة شريط التحميل
    simulateLoading();
    
    // تحميل البيانات المحفوظة
    loadSavedData();
    
    // تهيئة الصوت
    initAudio();
    
    // إعداد الأحداث
    setupEventListeners();
    
    // تحديث الواجهة
    updateUI();
    
    // إخفاء شاشة التحميل
    setTimeout(() => {
        document.getElementById('loading-screen').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('loading-screen').style.display = 'none';
            showToast('مرحباً بك في تطبيق النخبة PRO!', 'info');
        }, 500);
    }, 1500);
    
    console.log('✅ التطبيق جاهز!');
}

function simulateLoading() {
    let progress = 0;
    const interval = setInterval(() => {
        progress += 10;
        document.getElementById('loading-progress').style.width = progress + '%';
        
        if (progress >= 100) {
            clearInterval(interval);
        }
    }, 100);
}

function loadSavedData() {
    try {
        const saved = localStorage.getItem('elite_pro_app_data');
        if (saved) {
            const data = JSON.parse(saved);
            
            // دمج البيانات مع الحالة الافتراضية
            Object.keys(data).forEach(key => {
                if (APP_STATE[key] !== undefined) {
                    if (typeof APP_STATE[key] === 'object' && APP_STATE[key] !== null) {
                        Object.assign(APP_STATE[key], data[key]);
                    } else {
                        APP_STATE[key] = data[key];
                    }
                }
            });
            
            console.log('📁 تم تحميل البيانات المحفوظة');
        }
    } catch (error) {
        console.error('❌ خطأ في تحميل البيانات:', error);
    }
}

function saveData() {
    try {
        localStorage.setItem('elite_pro_app_data', JSON.stringify({
            currentCardIndex: APP_STATE.currentCardIndex,
            score: APP_STATE.score,
            reviewedCards: APP_STATE.reviewedCards,
            totalStudyTime: APP_STATE.totalStudyTime,
            difficultyStats: APP_STATE.difficultyStats,
            achievements: APP_STATE.achievements
        }));
    } catch (error) {
        console.error('❌ خطأ في حفظ البيانات:', error);
    }
}

// ========== UI UPDATES ==========
function updateUI() {
    const card = APP_STATE.cards[APP_STATE.currentCardIndex];
    
    // تحديث البطاقة
    document.getElementById('c-title').textContent = card.term;
    document.getElementById('c-desc').textContent = card.definition;
    document.getElementById('c-id').textContent = APP_STATE.currentCardIndex + 1;
    
    // تحديث الإحصائيات
    const percentage = Math.round((APP_STATE.reviewedCards / APP_STATE.cards.length) * 100);
    document.getElementById('p-val').textContent = percentage + '%';
    document.getElementById('s-val').textContent = APP_STATE.score;
    document.getElementById('r-val').textContent = APP_STATE.cards.length - APP_STATE.reviewedCards;
    
    // تحديث المستوى
    updateLevel();
    
    // تحديث قائمة الإنجازات
    updateAchievementsUI();
    
    // تحديث الإحصائيات في المودال
    updateStatsModal();
}

function updateLevel() {
    let level = "مبتدئ";
    let color = "#f87171";
    
    if (APP_STATE.score >= 1000) {
        level = "خبير";
        color = "#8b5cf6";
    } else if (APP_STATE.score >= 500) {
        level = "متقدم";
        color = "#3b82f6";
    } else if (APP_STATE.score >= 200) {
        level = "متوسط";
        color = "#34d399";
    } else if (APP_STATE.score >= 50) {
        level = "مبتدئ";
        color = "#fbbf24";
    }
    
    document.getElementById('level-val').textContent = level;
    document.getElementById('level-val').style.color = color;
}

function updateAchievementsUI() {
    const container = document.getElementById('achievements-list');
    if (!container) return;
    
    container.innerHTML = APP_STATE.achievements.map(achievement => `
        <div class="achievement-badge ${achievement.unlocked ? 'unlocked' : ''}" 
             title="${achievement.unlocked ? achievement.name : 'مقفل'}">
            <i class="fas ${achievement.icon} achievement-icon"></i>
            <div class="achievement-name">${achievement.name}</div>
        </div>
    `).join('');
}

function updateStatsModal() {
    document.getElementById('total-study-time').textContent = 
        Math.floor(APP_STATE.totalStudyTime / 60) + ' دقيقة';
    document.getElementById('hard-count').textContent = APP_STATE.difficultyStats.hard;
    document.getElementById('mid-count').textContent = APP_STATE.difficultyStats.mid;
    document.getElementById('easy-count').textContent = APP_STATE.difficultyStats.easy;
}

// ========== CARD OPERATIONS ==========
function flipCard() {
    const card = document.getElementById('main-card');
    card.classList.toggle('flipped');
    
    // تشغيل صوت القلب
    playSound(300, 150);
    
    // اهتزاز خفيف على الهواتف
    vibrate(30);
}

function prevCard() {
    APP_STATE.currentCardIndex--;
    if (APP_STATE.currentCardIndex < 0) {
        APP_STATE.currentCardIndex = APP_STATE.cards.length - 1;
    }
    
    // إعادة ضبط حالة القلب
    document.getElementById('main-card').classList.remove('flipped');
    
    // تحديث الواجهة
    updateUI();
    
    // تشغيل صوت التنقل
    playSound(200, 100);
    vibrate(20);
}

function nextCard() {
    APP_STATE.currentCardIndex++;
    if (APP_STATE.currentCardIndex >= APP_STATE.cards.length) {
        APP_STATE.currentCardIndex = 0;
    }
    
    // إعادة ضبط حالة القلب
    document.getElementById('main-card').classList.remove('flipped');
    
    // تحديث الواجهة
    updateUI();
    
    // تشغيل صوت التنقل
    playSound(250, 100);
    vibrate(20);
}
function rateCard(difficulty) {
    // تحديث الإحصائيات
    APP_STATE.difficultyStats[difficulty]++;
    
    // إضافة النقاط
    let points = 0;
    let message = '';
    let type = 'info';
    
    switch(difficulty) {
        case 'hard':
            points = 5;
            message = 'صعب! +5 نقاط';
            type = 'error';
            break;
        case 'mid':
            points = 15;
            message = 'متوسط! +15 نقطة';
            type = 'warning';
            break;
        case 'easy':
            points = 40;
            message = 'سهل! +40 نقطة 🎉';
            type = 'success';
            APP_STATE.reviewedCards++;
            break;
    }
    
    APP_STATE.score += points;
    
    // إظهار إشعار
    showToast(message, type);
    
    // تشغيل صوت التقييم
    playSound(difficulty === 'easy' ? 600 : 400, 300);
    vibrate(50);
    
    // التحقق من الإنجازات
    checkAchievements();
    
    // الانتقال للبطاقة التالية
    setTimeout(() => {
        nextCard();
        saveData();
    }, 300);
}

// ========== ACHIEVEMENTS ==========
function checkAchievements() {
    // إنجاز أول بطاقة
    if (APP_STATE.reviewedCards >= 1 && !APP_STATE.achievements[0].unlocked) {
        unlockAchievement(0);
    }
    
    // إنجاز النخبة (500 نقطة)
    if (APP_STATE.score >= 500 && !APP_STATE.achievements[3].unlocked) {
        unlockAchievement(3);
    }
    
    // إنجاز التركيز (25 دقيقة دراسة)
    if (APP_STATE.totalStudyTime >= 1500 && !APP_STATE.achievements[2].unlocked) {
        unlockAchievement(2);
    }
}

function unlockAchievement(index) {
    if (APP_STATE.achievements[index].unlocked) return;
    
    APP_STATE.achievements[index].unlocked = true;
    
    // إظهار إشعار الإنجاز
    showToast(`🏆 إنجاز مفتوح: ${APP_STATE.achievements[index].name}!`, 'success');
    
    // إضافة نقاط مكافأة
    APP_STATE.score += 100;
    
    // تشغيل صوت الإنجاز
    playSound(800, 1000);
    playSound(1000, 800);
    
    // تحديث الواجهة
    updateAchievementsUI();
    updateUI();
    
    // حفظ البيانات
    saveData();
}

// ========== AUDIO SYSTEM ==========
function initAudio() {
    try {
        APP_STATE.audioContext = new (window.AudioContext || window.webkitAudioContext)();
    } catch (error) {
        console.warn('⚠️ الصوت غير مدعوم في هذا المتصفح');
    }
}

function playSound(frequency, duration) {
    if (!APP_STATE.audioContext) return;
    
    try {
        const oscillator = APP_STATE.audioContext.createOscillator();
        const gainNode = APP_STATE.audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(APP_STATE.audioContext.destination);
        
        oscillator.frequency.value = frequency;
        oscillator.type = 'sine';
        
        gainNode.gain.setValueAtTime(0.05, APP_STATE.audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, APP_STATE.audioContext.currentTime + (duration / 1000));
        
        oscillator.start();
        oscillator.stop(APP_STATE.audioContext.currentTime + (duration / 1000));
    } catch (error) {
        console.warn('⚠️ خطأ في تشغيل الصوت:', error);
    }
}

function toggleFrequency(freq, button) {
    const buttons = document.querySelectorAll('.freq-btn');
    
    if (APP_STATE.activeFrequency === freq) {
        // إيقاف الصوت
        if (APP_STATE.oscillator) {
            APP_STATE.oscillator.stop();
            APP_STATE.oscillator = null;
        }
        
        APP_STATE.activeFrequency = null;
        buttons.forEach(btn => btn.classList.remove('active'));
        showToast(`تم إيقاف تردد ${freq}Hz`, 'info');
    } else {
        // إيقاف أي صوت سابق
        if (APP_STATE.oscillator) {
            APP_STATE.oscillator.stop();
        }
        
        // تشغيل التردد الجديد
        if (APP_STATE.audioContext) {
            try {
                APP_STATE.oscillator = APP_STATE.audioContext.createOscillator();
                const gainNode = APP_STATE.audioContext.createGain();
                
                APP_STATE.oscillator.connect(gainNode);
                gainNode.connect(APP_STATE.audioContext.destination);
                
                APP_STATE.oscillator.frequency.value = freq;
                APP_STATE.oscillator.type = 'sine';
                gainNode.gain.value = 0.02;
                
                APP_STATE.oscillator.start();
                
                APP_STATE.activeFrequency = freq;
                buttons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                
                let freqName = '';
                switch(freq) {
                    case 45: freqName = 'غاما (إبداع)'; break;
                    case 8: freqName = 'ثيتا (استرخاء)'; break;
                    case 432: freqName = 'موسيقي (تناغم)'; break;
                    default: freqName = `${freq}Hz`;
                }
                
                showToast(`تفعيل تردد ${freqName}`, 'success');
            } catch (error) {
                console.warn('⚠️ خطأ في تشغيل التردد:', error);
            }
        }
    }
}

// ========== POMODORO TIMER ==========
function togglePomodoro() {
    const btn = document.getElementById('pomo-btn');
    const icon = btn.querySelector('i');
    
    if (APP_STATE.pomodoroRunning) {
        // إيقاف المؤقت
        clearInterval(APP_STATE.pomodoroInterval);
        APP_STATE.pomodoroRunning = false;
        icon.className = 'fas fa-play';
        btn.style.background = '#3b82f6';
        showToast('تم إيقاف جلسة التركيز', 'info');
        
        // تحديث وقت الدراسة
        const sessionTime = Math.floor((Date.now() - APP_STATE.sessionStartTime) / 1000);
        APP_STATE.totalStudyTime += sessionTime;
        saveData();
    } else {
        // بدء المؤقت
        APP_STATE.pomodoroRunning = true;
        APP_STATE.sessionStartTime = Date.now();
        icon.className = 'fas fa-pause';
        btn.style.background = '#ef4444';
        
        APP_STATE.pomodoroInterval = setInterval(() => {
            APP_STATE.pomodoroTime--;
            
            const minutes = Math.floor(APP_STATE.pomodoroTime / 60);
            const seconds = APP_STATE.pomodoroTime % 60;
            
            document.getElementById('pomo-clock').textContent = 
                `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            
            // تغيير اللوع عند اقتراب النهاية
            if (APP_STATE.pomodoroTime <= 60) {
                document.getElementById('pomo-clock').style.color = '#f87171';
            }
            
            if (APP_STATE.pomodoroTime <= 0) {
                clearInterval(APP_STATE.pomodoroInterval);
                playSound(800, 1000);
                showToast('انتهت جلسة التركيز! خذ استراحة', 'success');
                APP_STATE.pomodoroTime = 1500;
                document.getElementById('pomo-clock').textContent = '25:00';
                document.getElementById('pomo-clock').style.color = '#60a5fa';
                APP_STATE.pomodoroRunning = false;
                icon.className = 'fas fa-play';
                btn.style.background = '#3b82f6';
            }
        }, 1000);
        
        showToast('بدء جلسة تركيز (25 دقيقة)', 'success');
    }
}
// ========== TOAST NOTIFICATIONS ==========
function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `
        <div class="toast-icon">
            ${type === 'success' ? '✅' : 
              type === 'error' ? '❌' : 
              type === 'warning' ? '⚠️' : 'ℹ️'}
        </div>
        <div class="toast-message">${message}</div>
    `;
    
    container.appendChild(toast);
    
    // إظهار الإشعار
    setTimeout(() => toast.classList.add('show'), 10);
    
    // إخفاء الإشعار بعد 3 ثواني
    setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => {
            if (toast.parentNode) {
                toast.parentNode.removeChild(toast);
            }
        }, 300);
    }, 3000);
}

// ========== VIBRATION ==========
function vibrate(duration) {
    if (navigator.vibrate) {
        try {
            navigator.vibrate(duration);
        } catch (error) {
            // تجاهل أخطاء الاهتزاز
        }
    }
}

// ========== MODAL CONTROLS ==========
function showModal(modalId) {
    const modal = document.getElementById(modalId);
    modal.classList.add('show');
    
    // منع التمرير خلف المودال
    document.body.style.overflow = 'hidden';
}

function closeModal(modalId) {
    const modal = document.getElementById(modalId);
    modal.classList.remove('show');
    
    // إعادة التمرير
    document.body.style.overflow = '';
}

// ========== DATA EXPORT/IMPORT ==========
function exportData() {
    const exportData = {
        appState: APP_STATE,
        exportDate: new Date().toISOString(),
        version: '1.0.0'
    };
    
    const dataStr = JSON.stringify(exportData, null, 2);
    const dataBlob = new Blob([dataStr], { type: 'application/json' });
    
    // إنشاء رابط تحميل
    const link = document.createElement('a');
    link.href = URL.createObjectURL(dataBlob);
    link.download = `elite_pro_backup_${new Date().toISOString().split('T')[0]}.json`;
    link.click();
    
    showToast('تم تصدير البيانات بنجاح', 'success');
}

function resetData() {
    if (confirm('هل تريد فعلاً إعادة تعيين كل البيانات؟ هذا الإجراء لا يمكن التراجع عنه.')) {
        localStorage.clear();
        location.reload();
    }
}

// ========== EVENT LISTENERS ==========
function setupEventListeners() {
    // زر الإحصائيات
    document.getElementById('stats-btn').addEventListener('click', () => {
        showModal('stats-modal');
    });
    
    // زر التصدير
    document.getElementById('export-btn').addEventListener('click', exportData);
    
    // إغلاق المودال عند النقر خارجها
    document.querySelectorAll('.modal-overlay').forEach(modal => {
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('show');
                document.body.style.overflow = '';
            }
        });
    });
    
    // أحداث اللمس للبطاقة (سحب)
    setupSwipeGestures();
    
    // اختصارات لوحة المفاتيح
    setupKeyboardShortcuts();
}

function setupSwipeGestures() {
    const card = document.getElementById('cardWrapper');
    let startX = 0;
    let startY = 0;
    let isSwiping = false;
    
    card.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        isSwiping = true;
    }, { passive: true });
    
    card.addEventListener('touchmove', (e) => {
        if (!isSwiping) return;
        
        const currentX = e.touches[0].clientX;
        const currentY = e.touches[0].clientY;
        
        const diffX = startX - currentX;
        const diffY = startY - currentY;
        
        // تجاهل الحركات الرأسية الكبيرة
        if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > 30) {
            isSwiping = false;
        }
    }, { passive: true });
    
    card.addEventListener('touchend', (e) => {
        if (!isSwiping) return;
        
        const endX = e.changedTouches[0].clientX;
        const diffX = startX - endX;
        
        if (Math.abs(diffX) > 50) {
            if (diffX > 0) {
                nextCard(); // سحب لليسار = التالي
            } else {
                prevCard(); // سحب لليمين = السابق
            }
            vibrate(30);
        }
        
        isSwiping = false;
    }, { passive: true });
}

function setupKeyboardShortcuts() {
    document.addEventListener('keydown', (e) => {
        // تجاهل إذا كان المستخدم يكتب في حقل نصي
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            return;
        }
        
        switch(e.key) {
            case 'ArrowRight':
                nextCard();
                e.preventDefault();
                break;
            case 'ArrowLeft':
                prevCard();
                e.preventDefault();
                break;
            case ' ':
            case 'Enter':
                flipCard();
                e.preventDefault();
                break;
            case '1':
                rateCard('hard');
                e.preventDefault();
                break;
            case '2':
                rateCard('mid');
                e.preventDefault();
                break;
            case '3':
                rateCard('easy');
                e.preventDefault();
                break;
            case 'Escape':
                if (APP_STATE.pomodoroRunning) {
                    togglePomodoro();
                }
                break;
        }
    });
}

// ========== INITIALIZE APP ==========
// بدء التطبيق عند تحميل الصفحة
window.addEventListener('DOMContentLoaded', initApp);

// حفظ البيانات عند إغلاق الصفحة
window.addEventListener('beforeunload', () => {
    // تحديث وقت الدراسة
    if (APP_STATE.pomodoroRunning) {
        const sessionTime = Math.floor((Date.now() - APP_STATE.sessionStartTime) / 1000);
        APP_STATE.totalStudyTime += sessionTime;
    }
    
    // حفظ البيانات
    saveData();
    
    // إيقاف الصوت
    if (APP_STATE.oscillator) {
        APP_STATE.oscillator.stop();
    }
});

document.addEventListener('click', () => {
    if (APP_STATE.audioContext && APP_STATE.audioContext.state === 'suspended') {
        APP_STATE.audioContext.resume();
    }
}, { once: true });
        // ========== DEBUGGING TOOLS ==========

            }
        };
