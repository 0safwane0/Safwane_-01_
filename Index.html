<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تطبيق النخبة PRO - تحت إشراف صفوان</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ========== CSS Variables & Base ========== */
:root {
  --primary: #3b82f6;
  --secondary: #8b5cf6;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --bg-dark: #020617;
  --glass: rgba(255, 255, 255, 0.03);
  --glass-strong: rgba(255, 255, 255, 0.07);
  --border: rgba(255, 255, 255, 0.1);
  --motion: 1;
  --accent: #3b82f6;
  --card-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  --focus-ring: rgba(59, 130, 246, 0.4);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-drag: none;
}

body {
  font-family: 'Tajawal', sans-serif;
  background-color: var(--bg-dark);
  color: #f8fafc;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  touch-action: manipulation;
  transition: background-color 0.5s ease;
}

body.light-theme {
  --bg-dark: #f8fafc;
  --glass: rgba(0, 0, 0, 0.03);
  --glass-strong: rgba(0, 0, 0, 0.07);
  --border: rgba(0, 0, 0, 0.1);
  color: #0f172a;
}

/* ========== Background Effects ========== */
.bg-canvas {
  position: fixed;
  inset: 0;
  z-index: -3;
  background: radial-gradient(circle at 50% 10%, #0f172a 0%, #020617 100%);
  transition: transform 0.15s linear;
}

.light-theme .bg-canvas {
  background: radial-gradient(circle at 50% 10%, #e2e8f0 0%, #f8fafc 100%);
}

.grid-overlay {
  position: fixed;
  inset: 0;
  z-index: -2;
  background-image: 
    linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
  background-size: 35px 35px;
  opacity: 0.2;
  pointer-events: none;
}

#glow-frame {
  position: fixed;
  inset: 0;
  pointer-events: none;
  transition: box-shadow 0.45s cubic-bezier(0.2, 0.9, 0.25, 1);
  z-index: 99;
}

/* ========== Glass Effects ========== */
.glass-panel {
  background: var(--glass);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid var(--border);
  transition: all 0.3s ease;
}

.glass-strong {
  background: var(--glass-strong);
  backdrop-filter: blur(40px);
  -webkit-backdrop-filter: blur(40px);
  border: 1px solid var(--border);
}

/* ========== Header & Navigation ========== */
header {
  position: relative;
  overflow: hidden;
}

header::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--primary), transparent);
}

.supervisor-badge {
  position: absolute;
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 11px;
  color: #cbd5e1;
  direction: ltr;
}

/* ========== Card System ========== */
.card-container {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  width: 100%;
  padding: 0 20px;
  transform: translateZ(0);
}

.card-wrapper {
  perspective: 2500px;
  width: 100%;
  max-width: 750px;
  height: 380px;
  z-index: 10;
  cursor: pointer;
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform calc(var(--motion) * 0.6s) cubic-bezier(0.34, 1.56, 0.64, 1);
  transform-style: preserve-3d;
  will-change: transform;
  outline: none;
  border-radius: 2.5rem;
}

.card-inner.is-flipped {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 2.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3rem;
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow: var(--card-shadow);
  overflow: hidden;
}

.light-theme .card-face {
  border: 1px solid rgba(0, 0, 0, 0.1);
}

.card-front {
  background: linear-gradient(165deg, #0f172a 0%, #020617 100%);
}

.light-theme .card-front {
  background: linear-gradient(165deg, #ffffff 0%, #f1f5f9 100%);
}

.card-back {
  background: linear-gradient(165deg, #1e3a8a 0%, #171717 100%);
  transform: rotateY(180deg);
}

.light-theme .card-back {
  background: linear-gradient(165deg, #dbeafe 0%, #e2e8f0 100%);
}

/* Card Content */
.card-badge {
  position: absolute;
  top: 1.5rem;
  left: 2rem;
  font-size: 11px;
  font-weight: 900;
  color: var(--primary);
  opacity: 0.7;
  letter-spacing: 2px;
}

.term-title {
  font-size: 2rem;
  font-weight: 900;
  color: #fff;
  margin-bottom: 1.5rem;
  text-align: center;
  text-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
  transition: letter-spacing 0.3s ease;
}

.light-theme .term-title {
  color: #0f172a;
  text-shadow: 0 2px 10px rgba(59, 130, 246, 0.1);
}

.term-description {
  font-size: 1.1rem;
  line-height: 1.8;
  color: #cbd5e1;
  text-align: center;
  font-weight: 500;
  max-width: 90%;
}

.light-theme .term-description {
  color: #475569;
}
  /* ========== Navigation & Buttons ========== */
.nav-btn {
  width: 50px;
  height: 50px;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  transition: all 0.3s ease;
  flex-shrink: 0;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.light-theme .nav-btn {
  background: rgba(0, 0, 0, 0.05);
  border: 1px solid rgba(0, 0, 0, 0.1);
}

.nav-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: var(--primary);
  transform: translateY(-2px);
}

.nav-btn:active {
  transform: translateY(0);
}

/* ========== Frequency Chips ========== */
.freq-chip {
  padding: 8px 16px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 900;
  background: rgba(0, 0, 0, 0.3);
  color: #64748b;
  transition: all 0.3s ease;
  border: 1px solid transparent;
  cursor: pointer;
  min-width: 70px;
  text-align: center;
}

.freq-chip.active {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #fff;
  box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
  border-color: rgba(255, 255, 255, 0.2);
}

/* ========== Rating Buttons ========== */
.rating-box {
  padding: 1.5rem;
  border-radius: 1.5rem;
  font-size: 13px;
  font-weight: 900;
  transition: all 0.3s ease;
  text-align: center;
  border: 1px solid transparent;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  position: relative;
  overflow: hidden;
}

.rating-box:hover {
  transform: translateY(-3px);
}

.rating-box:active {
  transform: translateY(0);
}

/* ========== Stats Dashboard ========== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  width: 100%;
  max-width: 800px;
}

.stat-card {
  border-radius: 1.5rem;
  padding: 1.2rem;
  text-align: center;
  transition: all 0.3s ease;
}

.stat-card:hover {
  transform: translateY(-3px);
}

.stat-label {
  font-size: 10px;
  color: #64748b;
  font-weight: 900;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.stat-value {
  font-size: 1.4rem;
  font-weight: 900;
}

/* ========== Theme Toggle ========== */
#theme-toggle {
  position: fixed;
  bottom: 25px;
  left: 25px;
  z-index: 120;
  width: 50px;
  height: 50px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  backdrop-filter: blur(10px);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
  border: 1px solid rgba(255, 255, 255, 0.08);
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

#theme-toggle:hover {
  transform: rotate(15deg) scale(1.1);
}

#theme-toggle:active {
  transform: rotate(15deg) scale(0.95);
}

.light-theme #theme-toggle {
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.02));
  border: 1px solid rgba(0, 0, 0, 0.08);
}

/* ========== Progress Ring ========== */
.progress-ring {
  position: relative;
  width: 180px;
  height: 180px;
  margin: 20px auto;
}

.progress-ring circle {
  fill: none;
  stroke-width: 8;
  stroke-linecap: round;
  transform: rotate(-90deg);
  transform-origin: 50% 50%;
  transition: stroke-dashoffset 0.5s ease;
}

.progress-ring-bg {
  stroke: rgba(255, 255, 255, 0.1);
}

.light-theme .progress-ring-bg {
  stroke: rgba(0, 0, 0, 0.1);
}

.progress-ring-fill {
  stroke: var(--primary);
  stroke-dasharray: 440;
  stroke-dashoffset: 440;
}

.progress-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 2.5rem;
  font-weight: 900;
  color: #fff;
}

.light-theme .progress-text {
  color: #0f172a;
}

/* ========== Ripple Effect ========== */
.ripple {
  position: relative;
  overflow: hidden;
}

.ripple-circle {
  position: absolute;
  border-radius: 50%;
  transform: scale(0);
  pointer-events: none;
  opacity: 0.6;
  animation: ripple-anim 0.6s ease-out;
  background: rgba(255, 255, 255, 0.2);
}

@keyframes ripple-anim {
  to {
    transform: scale(6);
    opacity: 0;
  }
}

/* ========== Skeleton Loading ========== */
.skeleton {
  display: inline-block;
  background: linear-gradient(90deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
  background-size: 200% 100%;
  animation: skeleton-shimmer 1.2s linear infinite;
  border-radius: 8px;
}

@keyframes skeleton-shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.light-theme .skeleton {
  background: linear-gradient(90deg, rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.05));
}

/* ========== Achievements ========== */
.achievement-badge {
  width: 50px;
  height: 50px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
  border: 1px solid rgba(255, 255, 255, 0.1);
  transition: all 0.3s ease;
}

.achievement-badge.unlocked {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
}

.achievement-badge i {
  font-size: 18px;
  margin-bottom: 4px;
}

.achievement-badge span {
  font-size: 9px;
  font-weight: 900;
}

/* ========== Toast Notifications ========== */
.toast {
  position: fixed;
  bottom: 100px;
  right: 50%;
  transform: translateX(50%);
  background: linear-gradient(135deg, rgba(0, 0, 0, 0.9), rgba(30, 30, 30, 0.9));
  backdrop-filter: blur(20px);
  color: white;
  padding: 16px 24px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.4s ease, transform 0.4s ease;
  border: 1px solid rgba(255, 255, 255, 0.1);
  max-width: 90%;
  text-align: center;
}

.toast.show {
  opacity: 1;
  transform: translateX(50%) translateY(0);
}

/* ========== Focus Mode ========== */
body.dim-ui header,
body.dim-ui nav,
body.dim-ui .stats-grid,
body.dim-ui .rating-container {
  opacity: 0.3;
  transition: opacity 0.5s ease;
  }
  /* ========== Responsive Design ========== */
@media (max-width: 768px) {
  .card-wrapper {
    height: 340px;
    max-width: 90%;
  }
  
  .card-face {
    padding: 2rem;
  }
  
  .term-title {
    font-size: 1.7rem;
  }
  
  .term-description {
    font-size: 1rem;
  }
  
  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  
  .card-container {
    gap: 10px;
    padding: 0 10px;
  }
  
  .nav-btn {
    width: 45px;
    height: 45px;
  }
  
  .rating-box {
    padding: 1.2rem;
    font-size: 12px;
  }
}

@media (max-width: 480px) {
  .card-wrapper {
    height: 300px;
  }
  
  .term-title {
    font-size: 1.5rem;
  }
  
  .rating-box {
    padding: 1rem;
    font-size: 11px;
  }
  
  .freq-chip {
    padding: 6px 12px;
    min-width: 60px;
    font-size: 11px;
  }
}

/* ========== Accessibility ========== */
@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  
  .card-inner {
    transition: none;
  }
}

/* ========== Focus States ========== */
:focus {
  outline: none;
}

button:focus-visible,
[tabindex]:focus-visible {
  box-shadow: 0 0 0 3px var(--focus-ring);
  border-radius: 12px;
}

/* ========== Halo Effect ========== */
.halo-effect {
  position: fixed;
  inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 150px rgba(59, 130, 246, 0.1);
  z-index: -1;
}
</style>
</head>
<body>
<!-- Background Elements -->
<div class="bg-canvas" id="bgCanvas"></div>
<div class="grid-overlay" id="gridOverlay"></div>
<div id="glow-frame"></div>
<div class="halo-effect"></div>

<!-- Header -->
<header class="w-full text-center py-4 glass-strong border-b border-white/5 backdrop-blur-3xl relative">
  <div class="supervisor-badge">تحت إشراف: صفوان</div>
  <span class="text-[13px] font-black text-blue-500 tracking-[0.8em] uppercase">تطبيق النخبة PRO</span>
</header>

<!-- Navigation -->
<nav class="w-full px-6 py-5 flex items-center justify-between">
  <div class="flex items-center gap-2 glass-panel p-2 rounded-2xl border border-white/10 shadow-inner">
    <button onclick="toggleFreq(45, this)" class="freq-chip">
      <i class="fas fa-brain mr-1"></i> 45Hz
    </button>
    <button onclick="toggleFreq(8, this)" class="freq-chip">
      <i class="fas fa-moon mr-1"></i> 8Hz
    </button>
    <button onclick="toggleFreq(432, this)" class="freq-chip">
      <i class="fas fa-music mr-1"></i> 432Hz
    </button>
  </div>
  
  <div class="flex items-center gap-3 glass-panel px-5 py-3 rounded-2xl border border-blue-500/20 shadow-lg">
    <div id="pomo-clock" class="font-mono text-blue-400 font-black text-base tracking-tighter">25:00</div>
    <button id="pomo-btn" onclick="togglePomo()" class="bg-gradient-to-r from-blue-600 to-blue-500 text-[11px] px-4 py-2 rounded-xl font-black shadow-lg transition-all hover:shadow-blue-500/30">
      <i class="fas fa-play mr-1"></i> ابدأ
    </button>
    <button onclick="resetPomo()" class="text-[10px] text-slate-400 hover:text-slate-300">
      <i class="fas fa-redo"></i>
    </button>
  </div>
</nav>

<!-- Main Content -->
<main class="flex-1 flex flex-col items-center justify-center space-y-8 px-4">
  <!-- Stats Dashboard -->
  <div class="stats-grid">
    <div class="stat-card glass-panel border-b-2 border-blue-500/30">
      <div class="stat-label">الاستيعاب</div>
      <p id="p-val" class="stat-value text-blue-400">0%</p>
    </div>
    
    <div class="stat-card glass-panel border-b-2 border-emerald-500/30">
      <div class="stat-label">المستوى</div>
      <p id="level-val" class="stat-value text-emerald-400">مبتدئ</p>
    </div>
    
    <div class="stat-card glass-panel border-b-2 border-yellow-500/30">
      <div class="stat-label">النقاط</div>
      <p id="s-val" class="stat-value text-yellow-400">0</p>
    </div>
    
    <div class="stat-card glass-panel border-b-2 border-red-500/30">
      <div class="stat-label">المتبقي</div>
      <p id="r-val" class="stat-value text-red-400">58</p>
    </div>
  </div>

  <!-- Card Container -->
  <div class="card-container">
    <button onclick="stepCard(-1)" class="nav-btn" aria-label="البطاقة السابقة">
      <i class="fas fa-chevron-right text-lg"></i>
    </button>
    
    <div class="card-wrapper" id="cardWrapper">
      <div id="main-card" class="card-inner" onclick="flip()" tabindex="0" aria-live="polite" role="button">
        <div class="card-face card-front">
          <div class="card-badge">CARD #<span id="c-id">01</span></div>
          <h2 id="c-title" class="term-title">تحميل المحتوى...</h2>
          <div id="progress-ring" class="progress-ring">
            <svg width="180" height="180">
              <circle class="progress-ring-bg" cx="90" cy="90" r="70"></circle>
              <circle class="progress-ring-fill" cx="90" cy="90" r="70" id="progress-circle"></circle>
            </svg>
            <div class="progress-text" id="progress-text">0%</div>
          </div>
          <div class="mt-10 flex items-center gap-3 opacity-30">
            <div class="w-3 h-3 bg-blue-500 rounded-full animate-pulse"></div>
            <span class="text-[10px] font-bold">انقر لقلب البطاقة</span>
          </div>
        </div>
        
        <div class="card-face card-back">
          <p id="c-desc" class="term-description px-6"></p>
          <div class="mt-10 text-xs text-slate-400">
            <i class="fas fa-lightbulb mr-1"></i> قيّم مدى صعوبة المصطلح
          </div>
        </div>
      </div>
    </div>
    
    <button onclick="stepCard(1)" class="nav-btn" aria-label="البطاقة التالية">
      <i class="fas fa-chevron-left text-lg"></i>
    </button>
  </div>

  <!-- Rating Buttons -->
  <div class="rating-container w-full max-w-md grid grid-cols-3 gap-6 px-6 pb-6">
    <button onclick="mark('hard')" class="rating-box bg-red-600/10 border border-red-500/20 text-red-500 hover:bg-red-600/20 ripple">
      <i class="fas fa-fire text-xl"></i>
      <span>صعب</span>
    </button>
    
    <button onclick="mark('mid')" class="rating-box bg-orange-600/10 border border-orange-500/20 text-orange-400 hover:bg-orange-600/20 ripple">
      <i class="fas fa-balance-scale text-xl"></i>
      <span>متوسط</span>
    </button>
    
    <button onclick="mark('easy')" class="rating-box bg-emerald-600/10 border border-emerald-500/20 text-emerald-400 hover:bg-emerald-600/20 ripple">
      <i class="fas fa-check-circle text-xl"></i>
      <span>سهل</span>
    </button>
  </div>
    <!-- Achievements Section -->
  <div id="achievements-container" class="w-full max-w-lg mt-4 px-6 hidden">
    <h3 class="text-sm font-bold mb-4 text-slate-300 text-center">الإنجازات</h3>
    <div class="flex justify-center gap-4">
      <div class="achievement-badge" id="achievement-1">
        <i class="fas fa-star"></i>
        <span>نجمة</span>
      </div>
      <div class="achievement-badge" id="achievement-2">
        <i class="fas fa-brain"></i>
        <span>تركيز</span>
      </div>
      <div class="achievement-badge" id="achievement-3">
        <i class="fas fa-trophy"></i>
        <span>نخبة</span>
      </div>
    </div>
  </div>
</main>

<!-- Theme Toggle -->
<button id="theme-toggle" aria-label="تبديل السمة">
  <i class="fas fa-moon" id="theme-icon"></i>
</button>

<!-- Toast Container -->
<div id="toast-container"></div>

<script>
/* =========================================================
   تطبيق النخبة PRO - النسخة الاحترافية الكاملة
   تحت إشراف: صفوان
   الإصدار: 3.0.0
========================================================= */

// قاعدة البيانات الأساسية للمصطلحات

/* ---------- نظام التخزين المحسن ---------- */
function savePro() {
  const saveData = {
    c: state.c,
    score: state.score,
    count: state.count,
    analytics: state.analytics,
    user: state.user,
    achievements: state.achievements,
    theme: state.theme,
    lastSession: Date.now()
  };
  localStorage.setItem("study-pro-v3", JSON.stringify(saveData));
}

function loadPro() {
  try {
    const saved = JSON.parse(localStorage.getItem("study-pro-v3") || "null");
    if (saved) {
      Object.assign(state, saved);
      if (saved.theme) {
        document.body.classList.toggle('light-theme', saved.theme === 'light');
        document.getElementById('theme-icon').className = saved.theme === 'light' ? 'fas fa-sun' : 'fas fa-moon';
      }
    }
    
    // تهيئة بيانات المستخدم إذا لم تكن موجودة
    if (!state.user) {
      state.user = {
        id: 'user_' + Date.now().toString(36),
        created: Date.now(),
        sessions: 1,
        totalStudyTime: 0,
        cardsMastered: 0
      };
    } else {
      state.user.sessions = (state.user.sessions || 0) + 1;
    }
  } catch (e) {
    console.error("خطأ في تحميل البيانات:", e);
  }
}

/* ---------- نظام الصوت المتقدم ---------- */
const AudioPro = (function() {
  let ctx = null, osc = null, gain = null;
  
  function getContext() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (ctx.state === "suspended") {
      ctx.resume();
    }
    return ctx;
  }
  
  function play(freq = 300, dur = 150, type = 'sine') {
    try {
      const audioCtx = getContext();
      stop();
      
      osc = audioCtx.createOscillator();
      gain = audioCtx.createGain();
      
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.type = type;
      
      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur / 1000);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + dur / 1000);
      
      setTimeout(stop, dur + 50);
    } catch (e) {
      console.warn("الصوت غير متاح:", e);
    }
  }
  
  function stop() {
    if (osc) {
      try {
        osc.stop();
        osc.disconnect();
      } catch (e) {}
      osc = null;
    }
    if (gain) {
      gain.disconnect();
      gain = null;
    }
  }
  
  // إيقاف الصوت عند ترك الصفحة
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stop();
  });
  
  return { play, stop, getContext };
})();

window.playSound = (f, d = 200) => AudioPro.play(f, d);
  /* ---------- نظام الإشعارات (Toast) ---------- */
function showToast(message, type = 'info', duration = 3000) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  
  let icon = 'ℹ️';
  if (type === 'success') icon = '✅';
  else if (type === 'warning') icon = '⚠️';
  else if (type === 'error') icon = '❌';
  else if (type === 'achievement') icon = '🏆';
  
  toast.innerHTML = `<span class="mr-2">${icon}</span> ${message}`;
  document.getElementById('toast-container').appendChild(toast);
  
  // إظهار الإشعار
  setTimeout(() => toast.classList.add('show'), 10);
  
  // إخفاء الإشعار بعد المدة المحددة
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 400);
  }, duration);
}

const ACHIEVEMENTS = {
  firstCard: { name: 'البداية', desc: 'أكمل أول بطاقة', icon: 'fa-star', points: 10 },
  fastLearner: { name: 'متسارع', desc: 'أكمل 5 بطاقات في أقل من دقيقتين', icon: 'fa-bolt', points: 25 },
  focusMaster: { name: 'مركز', desc: 'جلسة تركيز لمدة 25 دقيقة', icon: 'fa-brain', points: 50 },
  eliteLevel: { name: 'نخبة', desc: 'وصل إلى 500 نقطة', icon: 'fa-trophy', points: 100 },
  consistency: { name: 'منتظم', desc: '3 جلسات في يوم واحد', icon: 'fa-calendar-check', points: 75 }
};

function checkAchievements() {
  const now = Date.now();
  
  // إنجاز أول بطاقة
  if (state.count >= 1 && !state.achievements.includes('firstCard')) {
    unlockAchievement('firstCard');
  }
  
  // إنجاز النخبة
  if (state.score >= 500 && !state.achievements.includes('eliteLevel')) {
    unlockAchievement('eliteLevel');
  }
  
  // إنجاز التركيز
  if (state.focusScore > 80 && !state.achievements.includes('focusMaster')) {
    unlockAchievement('focusMaster');
  }
}

function unlockAchievement(id) {
  if (state.achievements.includes(id)) return;
  
  state.achievements.push(id);
  const achievement = ACHIEVEMENTS[id];
  
  // تحديث واجهة الإنجازات
  const badge = document.getElementById(`achievement-${state.achievements.length}`);
  if (badge) {
    badge.classList.add('unlocked');
    badge.innerHTML = `<i class="fas ${achievement.icon}"></i><span>${achievement.name}</span>`;
  }
  
  // إظهار الإشعار
  showToast(`إنجاز مفتوح: ${achievement.name}! (+${achievement.points} نقطة)`, 'achievement', 4000);
  
  // إضافة النقاط
  state.score += achievement.points;
  
  // تشغيل صوت الإنجاز
  playSound(800, 1000, 'sine');
  
  // حفظ البيانات
  savePro();
  updateUI();
}

/* ---------- واجهة المستخدم المحسنة ---------- */
function updateUI() {
  const card = ALL_CARDS[state.c] || ALL_CARDS[0];
  const inner = document.getElementById('main-card');
  
  requestAnimationFrame(() => {
    // تحديث النصوص
    document.getElementById('c-title').innerText = card.t;
    document.getElementById('c-desc').innerText = card.d;
    document.getElementById('c-id').innerText = (state.c + 1).toString().padStart(2, '0');
    document.getElementById('s-val').innerText = state.score;
    
    // حساب النسبة المئوية
    const percentage = Math.round((state.count / ALL_CARDS.length) * 100);
    document.getElementById('p-val').innerText = percentage + "%";
    
    // تحديث حلقة التقدم
    const progressCircle = document.getElementById('progress-circle');
    const progressText = document.getElementById('progress-text');
    const circumference = 2 * Math.PI * 70;
    const offset = circumference - (percentage / 100) * circumference;
    
    if (progressCircle) {
      progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
      progressCircle.style.strokeDashoffset = offset;
    }
    if (progressText) {
      progressText.innerText = percentage + "%";
    }
    
    // تحديث البطاقات المتبقية
    document.getElementById('r-val').innerText = ALL_CARDS.length - state.count;
    
    // تحديث المستوى
    let level = "مبتدئ";
    if (state.score >= 1000) level = "خبير";
    else if (state.score >= 500) level = "متقدم";
    else if (state.score >= 200) level = "متوسط";
    document.getElementById('level-val').innerText = level;
    
    // إعادة تعيين حالة القلب
    inner.classList.remove('is-flipped');
    
    // تحديث سرعة التعلم
    state.velocity = calculateVelocity();
    
    // إظهار قسم الإنجازات إذا تم فتح أي إنجاز
    if (state.achievements.length > 0) {
      document.getElementById('achievements-container').classList.remove('hidden');
    }
  });
}

function calculateVelocity() {
  if (state.analytics.length < 2) return 1;
  
  const recentMarks = state.analytics
    .filter(a => a.type === 'rate')
    .slice(-5);
  
  if (recentMarks.length < 2) return 1;
  
  const timeDiff = (recentMarks[recentMarks.length - 1].time - recentMarks[0].time) / 1000;
  const cardsPerMinute = (recentMarks.length / timeDiff) * 60;
  
  return Math.min(cardsPerMinute / 2, 3); // تطبيع بين 0 و3
}

/* ---------- نظام البطاقات التفاعلي ---------- */
function flip() {
  const inner = document.getElementById('main-card');
  const isFlipped = inner.classList.contains('is-flipped');
  
  // تأثير الرفع
  inner.style.transform += ' translateZ(20px)';
  setTimeout(() => {
    inner.style.transform = inner.style.transform.replace(' translateZ(20px)', '');
  }, 200);
  
  // تشغيل صوت
  playSound(isFlipped ? 320 : 280, 150);
  
  // قلب البطاقة
  inner.classList.toggle('is-flipped');
  
  // تتبع التحليلات
  state.analytics.push({
    type: "flip",
    card: state.c,
    time: Date.now(),
    wasFlipped: isFlipped
  });
}

function stepCard(direction) {
  // تأثير انتقال سينمائي
  document.body.style.filter = 'blur(5px)';
  setTimeout(() => {
    document.body.style.filter = '';
  }, 200);
  
  // تحديث الفهرس
  state.c = (state.c + direction + ALL_CARDS.length) % ALL_CARDS.length;
  
  // تشغيل صوت التنقل
  playSound(direction > 0 ? 350 : 300, 100);
  
  // تحديث الواجهة
  updateUI();
  
  // تتبع التحليلات
  state.analytics.push({
    type: "navigate",
    direction: direction > 0 ? "next" : "prev",
    card: state.c,
    time: Date.now()
  });
  
  // حفظ الحالة
  savePro();
}

/* ---------- نظام التقييم الذكي ---------- */
function mark(difficulty) {
  const now = Date.now();
  const card = ALL_CARDS[state.c];
  
  // تسجيل التقييم
  state.analytics.push({
    type: "rate",
    difficulty: difficulty,
    card: state.c,
    cardTitle: card.t,
    time: now,
    responseTime: now - state.lastCardTime
  });
  
  // تحديث وقت البطاقة الأخير
  state.lastCardTime = now;
  
  // تأثيرات بصرية حسب الصعوبة
  const glowFrame = document.getElementById('glow-frame');
  let color, points, soundFreq;
  
  switch (difficulty) {
    case 'easy':
      color = 'rgba(16, 185, 129, 0.4)';
      points = 40;
      soundFreq = 600;
      state.count++;
      state.score += points;
      showToast('ممتاز! +40 نقطة', 'success', 1500);
      break;
    case 'mid':
      color = 'rgba(245, 158, 11, 0.3)';
      points = 15;
      soundFreq = 450;
      state.score += points;
      showToast('جيد! +15 نقطة', 'warning', 1500);
      break;
    case 'hard':
      color = 'rgba(239, 68, 68, 0.3)';
      points = 5;
      soundFreq = 300;
      state.score += points;
      showToast('صعب! +5 نقاط', 'error', 1500);
      break;
  }
  
  // تطبيق التأثير البصري
  glowFrame.style.boxShadow = `inset 0 0 180px ${color}`;
  setTimeout(() => glowFrame.style.boxShadow = '', 600);
  
  // تشغيل الصوت
  playSound(soundFreq, 300);
  
  // تأثير الاهتزاز على الأجهزة المدعومة
  if (navigator.vibrate) navigator.vibrate(50);
  
  // التحقق من الإنجازات
  checkAchievements();
  
  // الانتقال للبطاقة التالية بعد تأخير
  setTimeout(() => {
    stepCard(1);
    savePro();
  }, 300);
  }
  /* ---------- أدوات التركيز المتقدمة ---------- */
function toggleFreq(hz, btn) {
  const chips = document.querySelectorAll('.freq-chip');
  
  if (state.freq === hz) {
    // إيقاف التردد الحالي
    AudioPro.stop();
    state.freq = null;
    chips.forEach(b => b.classList.remove('active'));
    showToast(`تم إيقاف تردد ${hz}Hz`, 'info');
  } else {
    // تشغيل التردد الجديد
    AudioPro.play(hz, 9999999, 'sine');
    state.freq = hz;
    chips.forEach(b => b.classList.toggle('active', b === btn));
    showToast(`تفعيل تردد ${hz}Hz للتركيز`, 'success');
  }
}

let pomoStart = null;
let pomoTotalSeconds = 0;

function togglePomo() {
  const btn = document.getElementById('pomo-btn');
  const clock = document.getElementById('pomo-clock');
  
  if (state.pOn) {
    // إيقاف المؤقت
    clearInterval(state.pInterval);
    state.pOn = false;
    btn.innerHTML = '<i class="fas fa-play mr-1"></i> ابدأ';
    btn.classList.remove('bg-red-600');
    btn.classList.add('bg-gradient-to-r', 'from-blue-600', 'to-blue-500');
    
    // حساب وقت الجلسة
    if (pomoStart) {
      const sessionSeconds = Math.floor((Date.now() - pomoStart) / 1000);
      pomoTotalSeconds += sessionSeconds;
      state.analytics.push({
        type: "focus",
        minutes: Math.floor(sessionSeconds / 60),
        totalSeconds: sessionSeconds,
        time: Date.now()
      });
      
      // تحديث إجمالي وقت الدراسة للمستخدم
      if (state.user) {
        state.user.totalStudyTime = (state.user.totalStudyTime || 0) + sessionSeconds;
      }
      
      pomoStart = null;
    }
    
    showToast('تم إيقاف جلسة التركيز', 'info');
  } else {
    // بدء المؤقت
    state.pOn = true;
    pomoStart = Date.now();
    btn.innerHTML = '<i class="fas fa-pause mr-1"></i> وقف';
    btn.classList.remove('bg-gradient-to-r', 'from-blue-600', 'to-blue-500');
    btn.classList.add('bg-red-600');
    
    state.pInterval = setInterval(() => {
      state.pTime--;
      
      const minutes = Math.floor(state.pTime / 60);
      const seconds = state.pTime % 60;
      clock.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
      
      // تغيير اللون عند انتهاء الوقت
      if (state.pTime <= 0) {
        clearInterval(state.pInterval);
        playSound(800, 1000);
        showToast('انتهت جلسة التركيز! خذ استراحة', 'achievement', 5000);
        
        // إعادة تعيين المؤقت
        setTimeout(() => {
          state.pTime = 1500;
          clock.innerText = '25:00';
          state.pOn = false;
          btn.innerHTML = '<i class="fas fa-play mr-1"></i> ابدأ';
          btn.classList.remove('bg-red-600');
          btn.classList.add('bg-gradient-to-r', 'from-blue-600', 'to-blue-500');
        }, 2000);
      } else if (state.pTime <= 60) {
        // آخر دقيقة
        clock.classList.add('text-red-400');
        clock.classList.remove('text-blue-400');
      }
    }, 1000);
    
    showToast('بدء جلسة تركيز (25 دقيقة)', 'success');
  }
  
  savePro();
}

function resetPomo() {
  state.pTime = 1500;
  document.getElementById('pomo-clock').innerText = '25:00';
  document.getElementById('pomo-clock').classList.remove('text-red-400');
  document.getElementById('pomo-clock').classList.add('text-blue-400');
  
  if (state.pOn) {
    clearInterval(state.pInterval);
    state.pOn = false;
    document.getElementById('pomo-btn').innerHTML = '<i class="fas fa-play mr-1"></i> ابدأ';
    document.getElementById('pomo-btn').classList.remove('bg-red-600');
    document.getElementById('pomo-btn').classList.add('bg-gradient-to-r', 'from-blue-600', 'to-blue-500');
  }
  
  showToast('تم إعادة تعيين المؤقت', 'info');
}

/* ---------- نظام التفاعل مع الخلفية (Parallax) ---------- */
function initParallax() {
  const bgCanvas = document.getElementById('bgCanvas');
  const gridOverlay = document.getElementById('gridOverlay');
  
  if (!bgCanvas || !gridOverlay) return;
  
  document.addEventListener('mousemove', (e) => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    
    const x = (e.clientX / window.innerWidth - 0.5) * 20;
    const y = (e.clientY / window.innerHeight - 0.5) * 20;
    
    bgCanvas.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    gridOverlay.style.backgroundPosition = `${50 - x / 10}% ${50 - y / 10}%`;
  });
}

/* ---------- نظام تأثيرات اللمس (Ripple) ---------- */
function initRippleEffects() {
  document.querySelectorAll('.ripple').forEach(button => {
    button.addEventListener('click', function(e) {
      const rect = this.getBoundingClientRect();
      const circle = document.createElement('span');
      circle.className = 'ripple-circle';
      
      const size = Math.max(rect.width, rect.height);
      circle.style.width = circle.style.height = size + 'px';
      circle.style.left = e.clientX - rect.left - size / 2 + 'px';
      circle.style.top = e.clientY - rect.top - size / 2 + 'px';
      
      this.appendChild(circle);
      
      circle.addEventListener('animationend', () => {
        circle.remove();
      }, { once: true });
    });
  });
}

/* ---------- نظام التوجيه بالأصابع (Swipe) ---------- */
function initSwipeGestures() {
  let startX = 0;
  let startY = 0;
  
  document.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  
  document.addEventListener('touchend', (e) => {
    if (!startX || !startY) return;
    
    const endX = e.changedTouches[0].clientX;
    const endY = e.changedTouches[0].clientY;
    
    const diffX = startX - endX;
    const diffY = startY - endY;
    
    // تجاهل الحركات الرأسية الكبيرة
    if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > 50) return;
    
    if (Math.abs(diffX) > 50) {
      if (diffX > 0) {
        stepCard(1); // سحب لليسار = التالي
      } else {
        stepCard(-1); // سحب لليمين = السابق
      }
    }
    
    startX = 0;
    startY = 0;
  }, { passive: true });
}

/* ---------- نظام التلميحات (Hints) ---------- */
function showHints() {
  // تظهر تلميحات للمستخدم الجديد
  if (!localStorage.getItem('hintShown')) {
    setTimeout(() => {
      showToast('💡 تلميح: اسحب البطاقة لليمين أو لليسار للتنقل', 'info', 5000);
    }, 3000);
    
    setTimeout(() => {
      showToast('🎯 اضغط على البطاقة لقلبها ورؤية التعريف', 'info', 5000);
    }, 10000);
    
    localStorage.setItem('hintShown', 'true');
  }
}

/* ---------- نظام التصدير والاستيراد ---------- */
function exportData() {
  const dataStr = JSON.stringify({
    state: state,
    cards: ALL_CARDS,
    version: state.version,
    exportDate: new Date().toISOString()
  }, null, 2);
  
  const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
  const exportFileDefaultName = `study-progress-${new Date().toISOString().split('T')[0]}.json`;
  
  const linkElement = document.createElement('a');
  linkElement.setAttribute('href', dataUri);
  linkElement.setAttribute('download', exportFileDefaultName);
  linkElement.click();
  
  showToast('تم تصدير بيانات التقدم بنجاح', 'success');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    
    reader.onload = event => {
      try {
        const importedData = JSON.parse(event.target.result);
        
        // التحقق من التوافق
        if (importedData.version && importedData.version.startsWith('pro-')) {
          Object.assign(state, importedData.state);
          savePro();
          updateUI();
          showToast('تم استيراد البيانات بنجاح', 'success');
          location.reload();
        } else {
          showToast('ملف غير متوافق مع هذا الإصدار', 'error');
        }
      } catch (err) {
        showToast('خطأ في قراءة الملف', 'error');
      }
    };
    
    reader.readAsText(file);
  };
  
  input.click();
}

/* ---------- نظام المفاتيح السريعة ---------- */
document.addEventListener("keydown", e => {
  // منع السلوك الافتراضي للمفاتيح المستخدمة
  if ([" ", "ArrowRight", "ArrowLeft", "1", "2", "3"].includes(e.key)) {
    e.preventDefault();
  }
  
  // المفاتيح السريعة
  switch(e.key) {
    case " ":
    case "Enter":
      flip();
      break;
    case "ArrowRight":
      stepCard(1);
      break;
    case "ArrowLeft":
      stepCard(-1);
      break;
    case "1":
      mark('hard');
      break;
    case "2":
      mark('mid');
      break;
    case "3":
      mark('easy');
      break;
    case "t":
    case "T":
      toggleTheme();
      break;
    case "Escape":
      if (state.pOn) togglePomo();
      break;
    case "r":
    case "R":
      if (e.ctrlKey) resetPomo();
      break;
  }
});

/* ---------- نظام التركيز التلقائي ---------- */
let idleTimer;
document.addEventListener('mousemove', () => {
  document.body.classList.remove('dim-ui');
  clearTimeout(idleTimer);
  
  idleTimer = setTimeout(() => {
    document.body.classList.add('dim-ui');
  }, 10000); // 10 ثوانٍ من عدم النشاط
});

/* ---------- تهيئة التطبيق ---------- */
window.addEventListener('DOMContentLoaded', () => {
  // تحميل البيانات
  loadPro();
  
  // إعداد حدث تبديل السمة
  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
  
  // تهيئة الواجهة
  updateUI();
  
  // تهيئة الأنظمة
  initParallax();
  initRippleEffects();
  initSwipeGestures();
  showHints();
  
  // تسجيل بداية الجلسة
  state.sessionStart = Date.now();
  state.analytics.push({
    type: "session_start",
    time: state.sessionStart,
    user: state.user.id
  });
  
  // حفظ تلقائي كل 30 ثانية
  setInterval(savePro, 30000);
  
  // رسالة بدء التشغيل
  setTimeout(() => {
    showToast(`مرحباً بك في تطبيق النخبة PRO! لديك ${state.score} نقطة`, 'success', 4000);
  }, 1000);
  
  console.log("تطبيق النخبة PRO - النسخة الاحترافية جاهز للعمل!");
  console.log("تحت إشراف: صفوان");
  console.log("الإصدار:", state.version);
});

/* ---------- التنظيف قبل إغلاق الصفحة ---------- */
window.addEventListener('beforeunload', () => {
  // تسجيل نهاية الجلسة
  const sessionDuration = Math.floor((Date.now() - state.sessionStart) / 1000);
  state.analytics.push({
    type: "session_end",
    time: Date.now(),
    duration: sessionDuration,
    cardsReviewed: state.count
  });
  
  // إيقاف الصوت
  AudioPro.stop();
  
  // حفظ البيانات النهائية
  savePro();
});

/* ---------- واجهات التصحيح ---------- */
window.showStats = () => {
  console.table({
    'البطاقة الحالية': state.c + 1,
    'النقاط': state.score,
    'البطاقات المكتملة': state.count,
    'سرعة التعلم': state.velocity.toFixed(2),
    'درجة التركيز': state.focusScore,
    'عدد الإنجازات': state.achievements.length,
    'طول الجلسة': Math.floor((Date.now() - state.sessionStart) / 60000) + ' دقيقة'
  });
};

window.resetProgress = () => {
  if (confirm('هل تريد فعلاً إعادة تعيين كل التقدم؟')) {
    localStorage.removeItem("study-pro-v3");
    location.reload();
  }
};

// جعل الدوال متاحة عالمياً
window.exportData = exportData;
window.importData = importData;
</script>
